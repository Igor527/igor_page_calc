<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgBlender)" />
  <!-- Isometric 3D wireframe mesh & cube -->
  <g transform="translate(400, 230)" stroke="url(#meshGrad)" stroke-width="2" fill="none">
    <!-- Main Isometric Cube / Prism -->
    <path d="M 0 -130 L 140 -50 L 0 30 L -140 -50 Z" fill="#3f3f46" fill-opacity="0.35" />
    <path d="M -140 -50 L 0 30 L 0 160 L -140 80 Z" fill="#27272a" fill-opacity="0.5" />
    <path d="M 140 -50 L 0 30 L 0 160 L 140 80 Z" fill="#18181b" fill-opacity="0.65" />
    
    <!-- Wireframe subdivisions -->
    <line x1="-70" y1="-90" x2="70" y2="-10" opacity="0.6" />
    <line x1="-70" y1="-10" x2="70" y2="-90" opacity="0.6" />
    <line x1="-70" y1="15" x2="-70" y2="120" opacity="0.6" />
    <line x1="70" y1="15" x2="70" y2="120" opacity="0.6" />
    <line x1="-140" y1="15" x2="0" y2="95" opacity="0.6" />
    <line x1="0" y1="95" x2="140" y2="15" opacity="0.6" />

    <!-- Vertices -->
    <circle cx="0" cy="-130" r="5" fill="#f97316" />
    <circle cx="140" cy="-50" r="5" fill="#f97316" />
    <circle cx="-140" cy="-50" r="5" fill="#f97316" />
    <circle cx="0" cy="30" r="5" fill="#38bdf8" />
    <circle cx="0" cy="160" r="5" fill="#38bdf8" />
    <circle cx="140" cy="80" r="5" fill="#38bdf8" />
    <circle cx="-140" cy="80" r="5" fill="#38bdf8" />
  </g>
  <!-- Blender Badge -->
  <rect x="50" y="50" width="280" height="70" rx="10" fill="#09090b" fill-opacity="0.8" stroke="#f97316" stroke-width="1.5" />
  <circle cx="85" cy="85" r="16" fill="#ea580c" />
  <circle cx="85" cy="85" r="6" fill="#ffffff" />
  <text x="115" y="82" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#f8fafc">Blender 3D Modeling</text>
  <text x="115" y="103" font-family="Consolas, monospace" font-size="13" fill="#cbd5e1">bpy.ops.mesh.primitive()</text>
</svg>
