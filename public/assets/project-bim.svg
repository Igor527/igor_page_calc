<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgBim)" />
  <!-- Infrastructure BIM layered model / bridge / tunnel -->
  <g stroke="#818cf8" stroke-width="2" fill="none">
    <!-- Curved Overpass Bridge Structure -->
    <path d="M 60 300 Q 400 120, 740 280" stroke="#a5b4fc" stroke-width="22" stroke-linecap="round" opacity="0.6" />
    <path d="M 60 300 Q 400 120, 740 280" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 12" />
    
    <!-- Bridge Piers -->
    <rect x="220" y="210" width="24" height="150" fill="#4f46e5" stroke="#c7d2fe" />
    <rect x="388" y="170" width="24" height="190" fill="#4f46e5" stroke="#c7d2fe" />
    <rect x="556" y="210" width="24" height="150" fill="#4f46e5" stroke="#c7d2fe" />

    <!-- Underground utility pipe -->
    <path d="M 80 390 C 260 370, 520 410, 720 380" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    
    <!-- Clash marker icon -->
    <g transform="translate(400, 160)">
      <circle cx="0" cy="0" r="18" fill="#ef4444" opacity="0.9" />
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#ffffff">!</text>
    </g>
  </g>
  <!-- BIM Coordination Badge -->
  <rect x="60" y="60" width="310" height="70" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.5" />
  <text x="85" y="93" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#f8fafc">BIM Infrastructure</text>
  <text x="85" y="114" font-family="Consolas, monospace" font-size="13" fill="#a5b4fc">IFC · Navisworks · Coordination</text>
</svg>
