<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPlan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgPlan)" />
  <!-- Urban planning blocks -->
  <g fill="#047857" fill-opacity="0.4" stroke="#6ee7b7" stroke-width="2" rx="8">
    <rect x="80" y="80" width="160" height="110" rx="8" />
    <rect x="280" y="80" width="220" height="90" rx="8" />
    <rect x="540" y="70" width="180" height="140" rx="8" />
    <rect x="80" y="240" width="190" height="150" rx="8" />
    <rect x="310" y="220" width="180" height="170" rx="8" />
    <rect x="530" y="250" width="200" height="140" rx="8" />
  </g>
  <!-- Main boulevard / street network -->
  <path d="M 40 210 L 760 200" stroke="#fef08a" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 40 210 L 760 200" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 10" fill="none" />
  <path d="M 260 40 L 290 410" stroke="#fef08a" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 510 40 L 515 410" stroke="#fef08a" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.7" />
  <!-- Roundabout -->
  <circle cx="270" cy="207" r="32" fill="#065f46" stroke="#fef08a" stroke-width="8" />
  <circle cx="270" cy="207" r="14" fill="#34d399" />
  <!-- Green park area -->
  <path d="M 330 240 C 360 230, 440 250, 460 300 C 470 340, 400 370, 340 350 Z" fill="#10b981" fill-opacity="0.7" stroke="#a7f3d0" stroke-width="2" />
  <!-- Title Badge -->
  <rect x="470" y="360" width="290" height="60" rx="10" fill="#022c22" fill-opacity="0.85" stroke="#34d399" stroke-width="1.5" />
  <text x="490" y="396" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ecfdf5">Urban Master Planning</text>
</svg>
