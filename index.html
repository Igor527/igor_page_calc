<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Urban Planner" />
  <link rel="canonical" href="https://urbanplanner.page/" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://*.gstatic.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.europe-west1.firebasedatabase.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://api.github.com https://api.mistral.ai https://*.googleapis.com https://docs.google.com https://api.allorigins.win https://corsproxy.io https://crossorigin.me https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.europe-west1.firebasedatabase.app wss://*.europe-west1.firebasedatabase.app https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://accounts.google.com https://*.firebaseapp.com https://*.github.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.google.com https://*.firebasedatabase.app https://*.europe-west1.firebasedatabase.app;" />
  <title>Urban Planner — Calculations & Engineering</title>
  <meta name="description" content="Urban Planner — Preliminary technical calculations, 3D engineering modeling, BIM services, and tools." />
  <!-- Тема и язык до первого кадра (убирает мелькание light→dark) -->
  <script>
    (function(){
      var m=parseInt(localStorage.getItem('themeMode'),10);
      if(isNaN(m))m=1;
      var theme=m===0?'light':'dark';
      document.documentElement.setAttribute('data-theme',theme);
      document.documentElement.classList.toggle('dark',theme==='dark');
      var lang=localStorage.getItem('site_lang');
      if(lang!=='ru') lang='en';
      document.documentElement.setAttribute('lang',lang);
    })();
  </script>
  <!-- Критический CSS: шапка/подвал и контентная область с первого кадра (best practice) -->
  <style>
    :root{--site-header-height:56px;--site-footer-height:56px;--content-offset-from-header:calc(var(--site-header-height) + 8px);}
    body{margin:0;min-height:100vh;background:#f9fafb;color:#1f2937;}
    html.dark body{background:#111827;color:#f3f4f6;}
    #root{padding-top:var(--content-offset-from-header,64px);padding-bottom:var(--site-footer-height,56px);min-height:100vh;box-sizing:border-box;}
    #header-container header{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;border-bottom:1px solid #e5e7eb;padding-top:env(safe-area-inset-top,0);}
    html.dark #header-container header{background:#111827;border-color:#374151;}
    #header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;flex-wrap:nowrap;}
    #header-container .site-header__btn{padding:6px 12px;font-size:14px;font-weight:500;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#374151;cursor:pointer;}
    #header-container .site-header__btn:hover{background:#f9fafb;}
    html.dark #header-container .site-header__btn{background:#1f2937;border-color:#4b5563;color:#e5e7eb;}
    html.dark #header-container .site-header__btn:hover{background:#374151;}
    #footer-container footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom,0);}
    html.dark #footer-container footer{background:#111827;border-color:#374151;}
    #footer-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:center;gap:16px;padding:12px 16px;flex-wrap:wrap;}
    #footer-container a{color:#4b5563;text-decoration:none;}
    #footer-container a:hover{text-decoration:underline;}
    html.dark #footer-container a{color:#9ca3af;}
  </style>
  <link rel="preload" href="/src/index.css" as="style" />
  <link rel="stylesheet" href="/src/index.css" />
</head>
<body>
  <div id="header-container">
    <header class="fixed top-0 left-0 w-full z-[1000] bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700">
      <div id="header-inner" class="max-w-[1200px] mx-auto flex items-center gap-3 justify-between py-3 px-4"></div>
    </header>
  </div>

  <div id="root"></div>

  <div id="footer-container"></div>

  <script>
    window.updateThemeBtn = function(theme) {
      var btn = document.getElementById('themeBtn');
      if (!btn) return;
      var isDark = theme === 'dark';
      btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
      var sunSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
      var moonSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
      btn.innerHTML = isDark ? moonSvg : sunSvg;
    };

    window.toggleTheme = function() {
      var mode = parseInt(localStorage.getItem('themeMode'), 10);
      if (isNaN(mode)) mode = 1;
      mode = (mode + 1) % 2;
      localStorage.setItem('themeMode', mode);
      var theme = mode === 0 ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark', theme === 'dark');
      window.updateThemeBtn(theme);
    };

    (function() {
      var footerContainer = document.getElementById('footer-container');
      if (footerContainer) {
        var footer = document.createElement('footer');
        footer.className = 'fixed bottom-0 left-0 w-full z-[1000] bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700';
        var footerInner = document.createElement('div');
        footerInner.id = 'footer-inner';
        footerInner.className = 'max-w-[1200px] mx-auto flex justify-center gap-4 py-3 px-4 flex-wrap';
        var telegramLink = document.createElement('a');
        telegramLink.href = 'https://t.me/igor_chevela';
        telegramLink.className = 'text-gray-600 dark:text-gray-400 hover:underline';
        telegramLink.target = '_blank';
        telegramLink.rel = 'noopener noreferrer';
        telegramLink.textContent = 'telegram';
        footerInner.appendChild(telegramLink);
        var emailLink = document.createElement('a');
        emailLink.href = 'mailto:hello@urbanplanner.page';
        emailLink.className = 'text-gray-600 dark:text-gray-400 hover:underline';
        emailLink.textContent = 'hello@urbanplanner.page';
        footerInner.appendChild(emailLink);
        var altEmailLink = document.createElement('a');
        altEmailLink.href = 'mailto:igr.sprk.one@gmail.com';
        altEmailLink.className = 'text-gray-600 dark:text-gray-400 hover:underline';
        altEmailLink.title = 'Alternative contact email';
        altEmailLink.textContent = 'igr.sprk.one@gmail.com';
        footerInner.appendChild(altEmailLink);
        var legalLink = document.createElement('a');
        legalLink.href = '/legal';
        legalLink.className = 'text-gray-600 dark:text-gray-400 hover:underline';
        legalLink.textContent = 'legal';
        legalLink.title = 'Legal & Business Notice: IGOR CHEVELA PR BEOGRAD';
        footerInner.appendChild(legalLink);
        footer.appendChild(footerInner);
        footerContainer.appendChild(footer);
      }
    })();

    (function() {
      var mode = parseInt(localStorage.getItem('themeMode'), 10);
      if (isNaN(mode)) mode = 1;
      var theme = mode === 0 ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark', theme === 'dark');
      window.updateThemeBtn(theme);
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
